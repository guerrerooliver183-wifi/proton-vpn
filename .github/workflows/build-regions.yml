  upload-artifacts:
    name: Upload Artifacts
    runs-on: ubuntu-latest
    needs:
      - build-mx
      - build-jp
      - build-ks
      - build-us
    steps:
      - name: Download regional APKs
        uses: actions/download-artifact@v4
        with:
          pattern: protonvpn-*
          path: regional-apks
          merge-multiple: true

      - name: Upload combined regional APKs
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-regional-apks
          path: regional-apks/**/*.apk
          if-no-files-found: error
          retention-days: 7
