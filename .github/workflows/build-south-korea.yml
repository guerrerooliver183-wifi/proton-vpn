name: Build ProtonVPN South Korea

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Download ProtonVPN 5.20.39.0 source archive
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/protonvpn-5.20.39.0.zip"
          SOURCE_DIR="$RUNNER_TEMP/protonvpn-source"
          curl --fail --location --retry 3 \
            https://github.com/ProtonVPN/android-app/archive/refs/tags/5.20.39.0.zip \
            --output "$ARCHIVE"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"
          mv "$SOURCE_DIR/android-app-5.20.39.0" "$GITHUB_WORKSPACE/proton-vpn"

          # The archive omits .git; Gradle reads the source tag to derive the app version.
          cd "$GITHUB_WORKSPACE/proton-vpn"
          git init --quiet --initial-branch=master
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git commit --quiet --allow-empty -m "Source archive ProtonVPN 5.20.39.0"
          git tag 5.20.39.0

      - name: Configure main Connect button for South Korea
        working-directory: proton-vpn
        run: |
          patch -p1 < "$GITHUB_WORKSPACE/patches/connect-button-south-korea.patch"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build Release
        working-directory: proton-vpn
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          CI_COMMIT_BRANCH: master
        run: |
          chmod +x ./gradlew

          ./gradlew assembleProductionVanillaOpenSourceRelease \
            -PappId=git.protonvpn.android.kr \
            -PkeyStoreFilePath="$RUNNER_TEMP/release.keystore" \
            -PkeyStoreKeyAlias="$KEYSTORE_ALIAS" \
            -PkeyStorePassword="$KEYSTORE_PASSWORD" \
            -PkeyStoreKeyPassword="$KEY_PASSWORD"

      - name: Show APK
        run: |
          find proton-vpn/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-south-korea
          path: proton-vpn/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
