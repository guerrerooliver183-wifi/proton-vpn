name: Build ProtonVPN Premium Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-premium:
    name: Build premium client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Checkout ProtonVPN source
        uses: actions/checkout@v6
        with:
          repository: ProtonVPN/android-app
          path: proton-vpn
          ref: master
          fetch-depth: 0

      - name: Apply premium client patch
        working-directory: proton-vpn
        run: patch --forward --batch -p1 < "$GITHUB_WORKSPACE/patches/unlock-premium-client.patch"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build premium client release
        working-directory: proton-vpn
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          CI_COMMIT_BRANCH: master
        run: |
          chmod +x ./gradlew
          ./gradlew assembleProductionVanillaOpenSourceRelease \
            -PappId=git.protonvpn.android.premium \
            -PkeyStoreFilePath="$RUNNER_TEMP/release.keystore" \
            -PkeyStoreKeyAlias="$KEYSTORE_ALIAS" \
            -PkeyStorePassword="$KEYSTORE_PASSWORD" \
            -PkeyStoreKeyPassword="$KEY_PASSWORD"

      - name: Show APK
        run: find proton-vpn/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload premium client APK
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-premium-client
          path: proton-vpn/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
